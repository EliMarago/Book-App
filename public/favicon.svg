<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Deep dark warm background gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2c2317"/>
      <stop offset="60%" stop-color="#18130d"/>
      <stop offset="100%" stop-color="#100c09"/>
    </radialGradient>
    
    <!-- Rich glowing gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Squircle container border stroke gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c6d2d"/>
      <stop offset="50%" stop-color="#54411b"/>
      <stop offset="100%" stop-color="#2b200b"/>
    </linearGradient>

    <!-- Subtle inner shadow/glow for depth -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer background base -->
  <rect width="512" height="512" fill="#100c09"/>

  <!-- Squircle container with rounded corners matching iOS / macOS / modern Web app style -->
  <rect x="28" y="28" width="456" height="456" rx="108" ry="108" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="14"/>
  
  <!-- Subtle inner border outline -->
  <rect x="38" y="38" width="436" height="436" rx="98" ry="98" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Icon: Book matching exact logo shape -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- Book Left Wing -->
    <path d="M-12 -90 C-50 -115, -120 -115, -165 -102 C-176 -98, -182 -88, -182 -76 L-182 82 C-182 92, -173 99, -163 97 C-122 88, -55 88, -12 108 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Book Right Wing -->
    <path d="M12 -90 C50 -115, 120 -115, 165 -102 C176 -98, 182 -88, 182 -76 L182 82 C182 92, 173 99, 163 97 C122 88, 55 88, 12 108 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center Spine Spine base curve -->
    <path d="M-12 -90 L0 -78 L12 -90" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Spine Vertical Line -->
    <line x1="0" y1="-78" x2="0" y2="124" 
          stroke="url(#goldGrad)" 
          stroke-width="28" 
          stroke-linecap="round"/>
  </g>
</svg>